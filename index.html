<script>
/*!
 * PCC Engine — Preconception Care Clinic rule engine
 * Pure functions, no DOM. ใช้ร่วมกันระหว่าง browser และ node --test

(function (root, factory) {
  var api = factory();
  if (typeof module === "object" && module.exports) module.exports = api;
  else root.PCCEngine = api;
})(typeof globalThis !== "undefined" ? globalThis : this, function () {
  "use strict";

  var LEVEL_RANK = { GREEN: 0, YELLOW: 1, RED: 2 };
  var METHOD_SHORT = { CHC: "CHC", POP: "POP", DMPA: "DMPA", IMPLANT: "Implant", LNG_IUS: "LNG-IUS", CU_IUD: "Cu-IUD" };
  var NOTE_LIMIT = 1500;

  function arr(x) { return Array.isArray(x) ? x : x == null ? [] : [x]; }
  function uniq(list) {
    var seen = {}, out = [];
    list.forEach(function (v) { if (v != null && v !== "" && !seen[v]) { seen[v] = true; out.push(v); } });
    return out;
  }

  /* ---------------- BR-15 KB validation ---------------- */
  function validateKB(kb) {
    var errors = [];
    if (!kb || typeof kb !== "object") return ["KB ไม่ใช่ JSON object"];
    ["meta", "config", "intention", "pathways", "base_plan", "conditions", "mec", "drug_alerts"].forEach(function (k) {
      if (!kb[k]) errors.push("ไม่มี key: " + k);
    });
    if (errors.length) return errors;
    var ids = {}, methods = (kb.mec.methods || []).map(function (m) { return m.id; });
    var consult = Object.keys(kb.config.consult_targets || {});
    var mecIds = {};
    function addId(id, where) { if (!id) errors.push("ไม่มี id ใน " + where); else if (ids[id]) errors.push("id ซ้ำ: " + id); else ids[id] = true; }
    (kb.mec.rows || []).forEach(function (r) {
      addId(r.id, "mec.rows"); mecIds[r.id] = true;
      if (!r.src) errors.push(r.id + ": ไม่มี src");
      methods.forEach(function (m) { var v = r.cat && r.cat[m]; if ([1, 2, 3, 4].indexOf(v) < 0) errors.push(r.id + ": category " + m + " ไม่ถูกต้อง"); });
    });
    function chkMec(list, where) { arr(list).forEach(function (x) { if (!mecIds[x]) errors.push(where + ": mec ref ไม่มีจริง " + x); }); }
    function chkConsult(list, where) { arr(list).forEach(function (x) { if (consult.indexOf(x) < 0) errors.push(where + ": consult ไม่มีจริง " + x); }); }
    var drugIds = {};
    (kb.drug_alerts || []).forEach(function (d) { drugIds[d.id] = true; });
    kb.conditions.forEach(function (c) {
      addId(c.id, "conditions");
      chkMec(c.mec_default, c.id); chkConsult(c.always_consult, c.id); chkConsult(c.consult_suggest, c.id);
      (c.criteria || []).forEach(function (cr) {
        addId(cr.id, c.id);
        if (["RED", "YELLOW", "INFO"].indexOf(cr.level) < 0) errors.push(cr.id + ": level ไม่ถูกต้อง");
        if (!cr.src) errors.push(cr.id + ": ไม่มี src");
        chkMec(cr.mec, cr.id); if (cr.consult) chkConsult(cr.consult, cr.id);
        if (cr.drug_link && !drugIds[cr.drug_link]) errors.push(cr.id + ": drug_link ไม่มีจริง");
      });
    });
    (kb.general_modifiers || []).forEach(function (g) { addId(g.id, "general_modifiers"); chkMec(g.mec, g.id); if (g.consult) chkConsult(g.consult, g.id); });
    kb.drug_alerts.forEach(function (d) {
      addId(d.id, "drug_alerts"); chkMec(d.mec, d.id); if (d.consult) chkConsult(d.consult, d.id);
      if (!d.src) errors.push(d.id + ": ไม่มี src");
    });
    return errors;
  }

  /* ---------------- helpers ---------------- */
  function index(kb) {
    var ix = { cond: {}, crit: {}, row: {}, drug: {}, mod: {}, method: {} };
    kb.conditions.forEach(function (c) { ix.cond[c.id] = c; (c.criteria || []).forEach(function (cr) { ix.crit[cr.id] = { item: cr, cond: c }; }); });
    kb.mec.rows.forEach(function (r) { ix.row[r.id] = r; });
    kb.drug_alerts.forEach(function (d) { ix.drug[d.id] = d; });
    (kb.general_modifiers || []).forEach(function (m) { ix.mod[m.id] = m; });
    kb.mec.methods.forEach(function (m, i) { ix.method[m.id] = { tier: m.tier, order: i, label: m.label }; });
    return ix;
  }

  function normalize(input) {
    input = input || {};
    return {
      pregnant: input.pregnant === true,
      ga_weeks: typeof input.ga_weeks === "number" && isFinite(input.ga_weeks) ? input.ga_weeks : null,
      intention: input.intention || null,
      ever_sex: input.ever_sex === true ? true : input.ever_sex === false ? false : null,
      conditions: uniq(arr(input.conditions)),
      criteria: input.criteria && typeof input.criteria === "object" ? input.criteria : {},
      modifiers: uniq(arr(input.modifiers)),
      drugs: uniq(arr(input.drugs))
    };
  }

  function isTriggered(cr, v) {
    if (cr.type === "tri") return v === true || (v === "unknown" && cr.unknown_as === true);
    return v === true;
  }

  function clinicLabels(kb, clinic) {
    return arr(clinic).map(function (k) { return (kb.config.clinics && kb.config.clinics[k]) || k; });
  }

  /* ---------------- evaluate ---------------- */
  function evaluate(rawInput, kb) {
    var ix = index(kb), inp = normalize(rawInput);
    var selConds = inp.conditions.map(function (id) { return ix.cond[id]; }).filter(Boolean);
    var selCondIds = selConds.map(function (c) { return c.id; });

    var triggered = [], unknownLabs = [];
    selConds.forEach(function (c) {
      (c.criteria || []).forEach(function (cr) {
        var v = inp.criteria[cr.id];
        if (isTriggered(cr, v)) triggered.push({ item: cr, cond: c, unknown: v === "unknown" });
        if (cr.type === "tri" && v === "unknown") unknownLabs.push("ตรวจเพิ่ม: " + cr.label);
      });
    });
    var mods = inp.modifiers.map(function (id) { return ix.mod[id]; }).filter(Boolean);
    var drugs = inp.drugs.map(function (id) { return ix.drug[id]; }).filter(function (d) {
      return d && (!d.only_if_condition || selCondIds.indexOf(d.only_if_condition) >= 0);
    });

    /* BR-01 level */
    var level = "GREEN";
    function bump(l) { if (LEVEL_RANK[l] != null && LEVEL_RANK[l] > LEVEL_RANK[level]) level = l; }
    triggered.forEach(function (t) { bump(t.item.level); });
    drugs.forEach(function (d) { bump(d.level); });

    var reasons = triggered.filter(function (t) { return t.item.level !== "INFO"; }).map(function (t) {
      return { id: t.item.id, kind: "criterion", level: t.item.level, label: t.item.label, action: t.item.action || null,
        condition: t.cond.label, src: t.item.src, review: t.item.review || null, decision: t.item.decision || null };
    });
    drugs.filter(function (d) { return d.level === "RED" || d.level === "YELLOW"; }).forEach(function (d) {
      reasons.push({ id: d.id, kind: "drug", level: d.level, label: d.name + " — " + d.alert, action: d.action || null,
        condition: "ยาที่ใช้อยู่", src: d.src, review: d.review || null, decision: d.decision || null });
    });
    reasons.sort(function (a, b) { return LEVEL_RANK[b.level] - LEVEL_RANK[a.level]; });

    var infos = triggered.filter(function (t) { return t.item.level === "INFO"; }).map(function (t) {
      return { id: t.item.id, label: t.item.label + (t.unknown ? " (ยังไม่ทราบผล — ถือเป็นจริง)" : ""), condition: t.cond.label, src: t.item.src };
    }).concat(mods.map(function (m) { return { id: m.id, label: m.label, condition: "ข้อมูลทั่วไป", src: m.src }; }));

    /* BR-02 consult */
    var cmap = {}, corder = [];
    function addConsult(key, required, from) {
      var t = kb.config.consult_targets[key]; if (!t) return;
      if (!cmap[key]) { cmap[key] = { key: key, label: t.label, destination: t.destination, required: false, from: [] }; corder.push(key); }
      if (required) cmap[key].required = true;
      if (from && cmap[key].from.indexOf(from) < 0) cmap[key].from.push(from);
    }
    selConds.forEach(function (c) {
      arr(c.always_consult).forEach(function (k) { addConsult(k, true, c.label); });
      arr(c.consult_suggest).forEach(function (k) { addConsult(k, false, c.label); });
    });
    triggered.forEach(function (t) { if (t.item.consult) addConsult(t.item.consult, true, t.item.label); });
    drugs.forEach(function (d) { if (d.consult) addConsult(d.consult, true, d.name); });
    mods.forEach(function (m) { if (m.consult) addConsult(m.consult, false, m.label); });
    var consults = corder.map(function (k) { return cmap[k]; }).sort(function (a, b) { return (b.required ? 1 : 0) - (a.required ? 1 : 0); });

    /* BR-04..08 route & pathway */
    var route = null, pathway = null;
    if (inp.pregnant) {
      route = "PREGNANT";
      var pg = kb.pathways.pregnant, key;
      if (level === "RED") {
        if (inp.ga_weeks == null) key = "CANNOT_CONTINUE_UNKNOWN_GA";
        else key = inp.ga_weeks < pg.ga_cutoff_weeks ? "CANNOT_CONTINUE_LT_CUTOFF" : "CANNOT_CONTINUE_GE_CUTOFF";
      } else key = "CAN_CONTINUE";
      var p = pg[key] || { action: "ระบุอายุครรภ์เพื่อเลือกเส้นทางการดูแล" };
      pathway = { key: key, clinics: clinicLabels(kb, p.clinic), clinicKeys: arr(p.clinic), action: p.action, register: pg.register };
    } else {
      var ans = (kb.intention.answers || []).filter(function (a) { return a.id === inp.intention; })[0];
      route = ans ? ans.route : null;
      var np = kb.pathways.not_pregnant;
      if (route === "PRECONCEPTION_ASSESS" || route === "BOTH") {
        var pp = np.PRECONCEPTION_ASSESS[level];
        pathway = { key: level, clinics: clinicLabels(kb, pp.clinic), clinicKeys: arr(pp.clinic), action: pp.action, meds: pp.meds || null };
      } else if (route === "CONTRACEPTION") {
        var ck = inp.ever_sex === false ? "NEVER_SEX" : "EVER_SEX";
        var cp = np.CONTRACEPTION[ck];
        pathway = { key: ck, clinics: clinicLabels(kb, cp.clinic), clinicKeys: arr(cp.clinic), action: cp.action };
      }
    }
    var preconPath = !!(pathway && pathway.clinicKeys.indexOf("PRECONCEPTION") >= 0);

    /* meds, plan, targets */
    var meds = [];
    if (preconPath) meds = level === "GREEN" ? arr(kb.base_plan.ready_meds) : arr(pathway.meds);
    var plan = [], targets = [];
    selConds.forEach(function (c) {
      arr(c.plan).forEach(function (x) { plan.push({ condition: c.label, text: x }); });
      arr(c.targets).forEach(function (x) { targets.push({ condition: c.label, text: x }); });
    });

    /* BR-03 labs */
    var labs = preconPath ? arr(kb.base_plan.base_labs).slice() : [];
    selConds.forEach(function (c) { labs = labs.concat(arr(c.workup)); });
    triggered.forEach(function (t) { labs = labs.concat(arr(t.item.labs)); });
    drugs.forEach(function (d) { labs = labs.concat(arr(d.labs)); });
    labs = uniq(labs.concat(unknownLabs));

    /* counseling */
    var counseling = [];
    if (preconPath) arr(kb.base_plan.lifestyle_counseling).forEach(function (x) { counseling.push({ from: "ทั่วไป", text: x }); });
    selConds.forEach(function (c) { arr(c.counseling).forEach(function (x) { counseling.push({ from: c.label, text: x }); }); });
    triggered.forEach(function (t) { if (t.item.counsel) counseling.push({ from: t.item.label, text: t.item.counsel }); });
    mods.forEach(function (m) { if (m.counsel) counseling.push({ from: m.label, text: m.counsel }); });

    var drugAlerts = drugs.map(function (d) {
      return { id: d.id, name: d.name, level: d.level, alert: d.alert, action: d.action || null, src: d.src, review: d.review || null };
    });

    /* BR-09..11 MEC */
    var used = [];
    function useRow(rid, from) { var r = ix.row[rid]; if (r && !used.some(function (u) { return u.row.id === rid && u.from === from; })) used.push({ row: r, from: from }); }
    selConds.forEach(function (c) {
      var withMec = triggered.filter(function (t) { return t.cond.id === c.id && arr(t.item.mec).length; });
      if (withMec.length) withMec.forEach(function (t) { arr(t.item.mec).forEach(function (r) { useRow(r, t.item.label); }); });
      else arr(c.mec_default).forEach(function (r) { useRow(r, c.label); });
    });
    mods.forEach(function (m) { arr(m.mec).forEach(function (r) { useRow(r, m.label); }); });
    drugs.forEach(function (d) { arr(d.mec).forEach(function (r) { useRow(r, d.name); }); });

    var byMethod = {};
    kb.mec.methods.forEach(function (m) {
      var max = 1;
      used.forEach(function (u) { if (u.row.cat[m.id] > max) max = u.row.cat[m.id]; });
      var limiting = max > 1 ? used.filter(function (u) { return u.row.cat[m.id] === max; }).map(function (u) {
        return { rowId: u.row.id, rowLabel: u.row.label, from: u.from };
      }) : [];
      byMethod[m.id] = { cat: max, limiting: limiting };
    });
    var order = kb.mec.methods.map(function (m) { return m.id; });
    var recommended = order.filter(function (k) { return byMethod[k].cat <= 2; }).sort(function (a, b) {
      return byMethod[a].cat - byMethod[b].cat || ix.method[a].tier - ix.method[b].tier || ix.method[a].order - ix.method[b].order;
    });
    var mec = {
      byMethod: byMethod,
      recommended: recommended,
      notAdvised: order.filter(function (k) { return byMethod[k].cat === 3; }),
      contraindicated: order.filter(function (k) { return byMethod[k].cat === 4; }),
      rowsUsed: used.map(function (u) { return { id: u.row.id, label: u.row.label, from: u.from, cat: u.row.cat, note: u.row.note || null }; }),
      notes: uniq(used.map(function (u) { return u.row.note; }).concat(selConds.map(function (c) { return c.contraception_note ? c.label + ": " + c.contraception_note : null; }))),
      permanent: level === "RED" ? kb.mec.permanent_option : null,
      focus: route === "CONTRACEPTION" || route === "BOTH" || level !== "GREEN"
    };

    /* BR-14 review flags */
    var flags = [];
    function addFlag(id, rv) { if (rv && !flags.some(function (f) { return f.id === id; })) flags.push({ id: id, flag: rv.flag, note: rv.note }); }
    triggered.forEach(function (t) { addFlag(t.item.id, t.item.review); });
    drugs.forEach(function (d) { addFlag(d.id, d.review); });
    used.forEach(function (u) { addFlag(u.row.id, u.row.review); });

    return {
      input: inp, level: level, levelText: (kb.meta.levels || {})[level] || level, route: route,
      conditions: selConds.map(function (c) { return { id: c.id, label: c.label }; }),
      reasons: reasons, infos: infos, pathway: pathway, consults: consults, labs: labs,
      meds: meds, plan: plan, targets: targets, counseling: counseling, drugAlerts: drugAlerts,
      mec: mec, flags: flags,
      kb: { version: kb.meta.version, status: kb.meta.status }
    };
  }

  /* ---------------- BR-16 copy note ---------------- */
  function thaiDateNum(d) {
    d = d || new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return p(d.getDate()) + "/" + p(d.getMonth() + 1) + "/" + (d.getFullYear() + 543);
  }

  function buildNote(result, kb, date) {
    var r = result, inp = r.input;
    var intent = (kb.intention.answers || []).filter(function (a) { return a.id === inp.intention; })[0];
    var head = "[PCC | KB " + r.kb.version + " " + r.kb.status + " | " + thaiDateNum(date) + "]";
    var status = inp.pregnant
      ? "สถานะ: ตั้งครรภ์" + (inp.ga_weeks != null ? " GA " + inp.ga_weeks + " สัปดาห์" : "")
      : "สถานะ: ไม่ตั้งครรภ์ | ต้องการตั้งครรภ์ใน 1 ปี: " + (intent ? intent.label : "-") + (inp.intention === "NO" ? " | เคยมีเพศสัมพันธ์: " + (inp.ever_sex === false ? "ไม่" : "ใช่") : "");
    var conds = "โรค: " + (r.conditions.length ? r.conditions.map(function (c) { return c.label; }).join(", ") : "ไม่มีโรคประจำตัวที่เลือก");
    var lvl = "ผลประเมิน: " + r.level + " — " + r.levelText;
    var reasonLines = r.reasons.map(function (x) { return " - " + x.label + (x.action ? " → " + x.action : "") + " (" + x.src + ")"; });
    var planLine = r.pathway ? "Plan: " + (r.pathway.clinics.length ? r.pathway.clinics.join(" + ") + " — " : "") + r.pathway.action : null;
    var medLine = r.meds.length ? "ยา: " + r.meds.join(", ") + (r.plan.length ? " · " + r.plan.map(function (p) { return p.text; }).join(" · ") : "") : null;
    var req = r.consults.filter(function (c) { return c.required; }).map(function (c) { return c.label; });
    var sug = r.consults.filter(function (c) { return !c.required; }).map(function (c) { return c.label; });
    var consultLine = req.length || sug.length ? "Consult: " + (req.join(", ") || "-") + (sug.length ? " | พิจารณาส่ง: " + sug.join(", ") : "") : null;
    var labLine = r.labs.length ? "Lab: " + r.labs.join(", ") : null;
    var rec = r.mec.recommended.map(function (k) { return METHOD_SHORT[k] + " (" + r.mec.byMethod[k].cat + ")"; });
    var bad = r.mec.notAdvised.concat(r.mec.contraindicated).map(function (k) { return METHOD_SHORT[k] + " (" + r.mec.byMethod[k].cat + ")"; });
    var mecLines = ["คุมกำเนิดที่เหมาะ: " + (rec.join(", ") || "-")];
    if (bad.length) mecLines.push("ไม่ควร/ห้าม: " + bad.join(", "));
    var tail = "* เครื่องมือช่วยตัดสินใจ ไม่ใช้แทนดุลยพินิจแพทย์";

    function assemble(reasonsL, labL) {
      return [head, status, conds, lvl].concat(reasonsL, [planLine, medLine, consultLine, labL], mecLines, [tail])
        .filter(function (x) { return x; }).join("\n");
    }
    var text = assemble(reasonLines, labLine);
    if (text.length > NOTE_LIMIT && labLine) text = assemble(reasonLines, "Lab: " + r.labs.length + " รายการ ตามใบพิมพ์");
    if (text.length > NOTE_LIMIT && reasonLines.length > 4) {
      var shortR = reasonLines.slice(0, 4).map(function (l) { return l.length > 110 ? l.slice(0, 107) + "…" : l; });
      shortR.push(" - และอีก " + (reasonLines.length - 4) + " ข้อ ตามใบพิมพ์");
      text = assemble(shortR, "Lab: " + r.labs.length + " รายการ ตามใบพิมพ์");
    }
    return text;
  }

  return { validateKB: validateKB, evaluate: evaluate, buildNote: buildNote, thaiDateNum: thaiDateNum,
    LEVEL_RANK: LEVEL_RANK, METHOD_SHORT: METHOD_SHORT, NOTE_LIMIT: NOTE_LIMIT };
});

</script>
<script>
(function () {
  "use strict";
  var E = window.PCCEngine;
  var app = document.getElementById("app");
  var KB = null, KB_ERRORS = [];
  try { KB = JSON.parse(document.getElementById("kb-data").textContent); KB_ERRORS = E.validateKB(KB); }
  catch (err) { KB_ERRORS = ["อ่าน kb.json ไม่ได้: " + err.message]; }
  var SHA = (document.querySelector('meta[name="pcc-kb-sha256"]') || {}).content || "-";

  /* ---------- helpers ---------- */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function link(url, text) { return /^https:\/\//.test(url || "") ? '<a class="text-orange-700 underline decoration-orange-300" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(text) + "</a>" : esc(text); }
  function toggle(list, v) { var i = list.indexOf(v); if (i >= 0) list.splice(i, 1); else list.push(v); }
  function condLabel(id) { var c = KB.conditions.find(function (x) { return x.id === id; }); return c ? c.label : id; }
  var LV = {
    RED: { pill: "bg-rose-100 text-rose-700 ring-rose-200", box: "bg-rose-50 border-rose-300", text: "text-rose-800" },
    YELLOW: { pill: "bg-amber-100 text-amber-800 ring-amber-200", box: "bg-amber-50 border-amber-300", text: "text-amber-900" },
    GREEN: { pill: "bg-emerald-100 text-emerald-700 ring-emerald-200", box: "bg-emerald-50 border-emerald-300", text: "text-emerald-800" },
    INFO: { pill: "bg-slate-100 text-slate-600 ring-slate-200" }
  };
  var CAT = { 1: "bg-emerald-100 text-emerald-800", 2: "bg-lime-100 text-lime-800", 3: "bg-amber-200 text-amber-900", 4: "bg-rose-200 text-rose-900" };
  function pill(level) { return LV[level] ? '<span class="inline-flex shrink-0 items-center rounded-full px-2 py-0.5 text-xs font-semibold ring-1 ' + LV[level].pill + '">' + level + "</span>" : ""; }
  function catBadge(c) { return '<span class="inline-flex min-w-[2rem] justify-center rounded-lg px-2 py-0.5 text-sm font-bold ' + CAT[c] + '" title="' + esc(KB.mec.categories[c]) + '">' + c + "</span>"; }
  function flagMark(rv) { return rv && KB.meta.status !== "APPROVED" ? ' <span class="text-amber-600" title="' + esc(rv.flag + ": " + rv.note) + '" aria-label="มีประเด็นรอทบทวน">⚠</span>' : ""; }
  function decisionBadge(d) { return d ? '<span class="rounded bg-orange-50 px-1.5 text-[11px] font-semibold text-orange-700 ring-1 ring-orange-200">' + esc(d.cd) + "</span>" : ""; }
  function evidenceDetails(d) {
    if (!d) return "";
    var ev = d.evidence || [];
    if (!ev.length) return d.note ? '<p class="mt-1 text-xs text-gray-500">' + esc(d.cd + ": " + d.note) + "</p>" : "";
    return '<details class="mt-1 text-xs"><summary class="cursor-pointer text-orange-700">คำตัดสิน ' + esc(d.cd) + " · หลักฐาน " + ev.length + ' รายการ</summary><ul class="mt-1 list-disc space-y-1 pl-4 text-gray-600">' +
      ev.map(function (e) { return "<li>" + esc(e.text) + " — " + link(e.url, e.src) + "</li>"; }).join("") + "</ul>" +
      (d.note ? '<p class="mt-1 text-gray-500">' + esc(d.note) + "</p>" : "") + "</details>";
  }

  /* ---------- state (in-memory only, BR-17) ---------- */
  function newState() { return { step: 1, maxStep: 1, pregnant: null, ga: null, intention: null, everSex: null, conditions: [], criteria: {}, modifiers: [], drugs: [], last: null }; }
  var S = newState();
  function toInput() {
    return { pregnant: S.pregnant === true, ga_weeks: S.ga, intention: S.pregnant ? null : S.intention, ever_sex: S.everSex,
      conditions: S.conditions.slice(), criteria: S.criteria, modifiers: S.modifiers.slice(), drugs: S.drugs.slice() };
  }
  function step1Valid() {
    if (S.pregnant === true) return typeof S.ga === "number" && S.ga >= 1 && S.ga <= 45;
    if (S.pregnant === false) return !!S.intention && (S.intention !== "NO" || S.everSex !== null);
    return false;
  }

  /* ---------- assess ---------- */
  var STEPS = ["สถานะ", "โรคประจำตัว", "รายละเอียดและยา", "ผลลัพธ์"];
  function stepper() {
    return '<ol class="no-print mb-5 grid grid-cols-4 gap-2">' + STEPS.map(function (s, i) {
      var n = i + 1, cur = n === S.step, done = n < S.step, can = n <= S.maxStep;
      return '<li><button type="button" data-act="goto" data-v="' + n + '" ' + (can ? "" : "disabled") + ' class="w-full rounded-xl px-2 py-2 text-left text-xs sm:text-sm ' +
        (cur ? "bg-white ring-2 ring-orange-400" : "bg-white/60") + (can ? "" : " cursor-not-allowed opacity-50") + '"' + (cur ? ' aria-current="step"' : "") + '>' +
        '<span class="block text-[11px] ' + (done ? "text-emerald-600" : "text-gray-400") + '">ขั้น ' + n + (done ? " ✓" : "") + '</span><span class="font-semibold text-gray-800">' + s + "</span></button></li>";
    }).join("") + "</ol>";
  }
  function choice(act, v, title, sub, on) {
    return '<button type="button" data-act="' + act + '" data-v="' + esc(v) + '" aria-pressed="' + on + '" class="opt' + (on ? " opt-on" : "") + '">' +
      '<span class="block font-semibold text-gray-800">' + esc(title) + "</span>" + (sub ? '<span class="block text-sm text-gray-500">' + esc(sub) + "</span>" : "") + "</button>";
  }
  function check(act, id, label, on, src, extra) {
    return '<label class="chk' + (on ? " chk-on" : "") + '"><input type="checkbox" data-act="' + act + '" data-v="' + esc(id) + '" ' + (on ? "checked" : "") + ' class="mt-1 h-5 w-5 shrink-0 accent-orange-500">' +
      '<span class="min-w-0"><span class="text-gray-800">' + esc(label) + "</span>" + (extra || "") + (src ? '<span class="block text-xs text-gray-400">' + esc(src) + "</span>" : "") + "</span></label>";
  }
  function navButtons(back, nextDisabled, nextLabel) {
    return '<div class="no-print mt-5 flex items-center justify-between gap-3">' + (back ? '<button type="button" class="btn" data-act="back">ย้อนกลับ</button>' : "<span></span>") +
      '<button type="button" class="btn-primary" data-act="next" id="nextBtn" ' + (nextDisabled ? "disabled" : "") + ">" + (nextLabel || "ถัดไป") + "</button></div>";
  }

  function step1() {
    var q = KB.intention;
    var h = '<section class="card"><h2 class="h2">ผู้ป่วยตั้งครรภ์อยู่หรือไม่</h2><div class="mt-3 grid gap-3 sm:grid-cols-2">' +
      choice("preg", "0", "ยังไม่ตั้งครรภ์", "ประเมินความพร้อมก่อนตั้งครรภ์ หรือวางแผนคุมกำเนิด", S.pregnant === false) +
      choice("preg", "1", "ตั้งครรภ์แล้ว", "ประเมินว่าตั้งครรภ์ต่อได้หรือไม่ ตามอายุครรภ์", S.pregnant === true) + "</div>";
    if (S.pregnant === true) {
      h += '<div class="mt-5"><label for="ga" class="lbl">อายุครรภ์ (สัปดาห์)</label><input id="ga" type="number" inputmode="numeric" min="1" max="45" value="' + (S.ga == null ? "" : S.ga) + '" class="inp w-40" data-input="ga">' +
        '<p class="hint">ใช้แยกเส้นทางที่อายุครรภ์ ' + KB.pathways.pregnant.ga_cutoff_weeks + " สัปดาห์</p></div>";
    }

    return '<section class="card scroll-mt-24" id="ref-vac"><h2 class="h2">วัคซีน</h2><h3 class="h3 mt-3">dT ตามประวัติวัคซีน</h3><div class="mt-2 overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-gray-500"><th class="py-2 pr-3 font-semibold">ประวัติ</th><th class="py-2 pr-3 font-semibold">ให้</th><th class="py-2 font-semibold">จากนั้น</th></tr></thead><tbody>' +
      d.rules.map(function (r) { return '<tr class="border-t border-orange-100 align-top"><td class="py-2 pr-3">' + esc(r.history) + '</td><td class="py-2 pr-3">' + esc(r.give) + '</td><td class="py-2">' + esc(r.then || "—") + "</td></tr>"; }).join("") +
      '</tbody></table></div><p class="hint mt-2">' + esc(d.note) + " · " + esc(d.src) + "</p>" + block("ไอกรน (aP / Tdap)", v.aP) + block("ไข้หวัดใหญ่", v.influenza) + block("โควิด-19", v.covid19) + "</section>";
  }
  function refView() {
    var tools = KB.tools.filter(function (t) { return t.type === "table" || t.type === "list"; });
    var nav = [["ref-mec", "ตาราง MEC"], ["ref-vac", "วัคซีน"]].concat(tools.map(function (t) { return [t.id, t.name]; }));
    return '<div class="grid gap-6 lg:grid-cols-[220px_minmax(0,1fr)]"><nav class="no-print self-start lg:sticky lg:top-24" aria-label="หัวข้ออ้างอิง"><ul class="flex flex-wrap gap-2 lg:flex-col lg:gap-1">' +
      nav.map(function (n) { return '<li><a href="#/ref" data-jump="' + esc(n[0]) + '" class="block rounded-lg px-2 py-1 text-sm text-gray-600 hover:bg-orange-50">' + esc(n[1]) + "</a></li>"; }).join("") +
      '</ul></nav><div class="min-w-0 space-y-5">' + mecMatrix() + vaccinesCard() + tools.map(toolRefCard).join("") + "</div></div>";
  }

  /* ---------- tools ---------- */
  function scoreCard(t) {
    return '<section class="card" data-tool="' + esc(t.id) + '"><div class="flex flex-wrap items-baseline justify-between gap-2"><h2 class="h2">' + esc(t.name) + "</h2>" +
      (t.scope === "COULD" ? '<span class="rounded bg-slate-100 px-2 py-0.5 text-xs text-slate-600">บท 4.2 · ใช้ประกอบ</span>' : "") + '</div><p class="hint">' + esc(t.src) + (t.decision ? " · ยืนยันการแก้ตาม " + esc(t.decision.cd) : "") + "</p>" +
      '<div class="mt-3 space-y-3">' + t.items.map(function (it, i) {
        var zero = it.options.findIndex(function (o) { return o[1] === 0; });
        return '<label class="block"><span class="lbl">' + esc(it.param) + '</span><select class="inp w-full" data-act="score" data-i="' + i + '">' +
          it.options.map(function (o, j) { return '<option value="' + o[1] + '"' + (j === (zero < 0 ? 0 : zero) ? " selected" : "") + ">" + esc(o[0]) + " (" + o[1] + ")</option>"; }).join("") + "</select></label>";
      }).join("") + '</div><div class="mt-4 rounded-xl bg-orange-50 p-3"><span class="text-sm text-gray-500">คะแนนรวม</span> <b class="text-2xl text-orange-700" data-total>0</b><span class="block text-sm text-gray-800" data-interp></span></div></section>';
  }
  function updateScore(card) {
    if (!card) return;
    var t = KB.tools.find(function (x) { return x.id === card.dataset.tool; });
    var total = 0; card.querySelectorAll("select").forEach(function (s) { total += Number(s.value) || 0; });
    var rules = (t.interpret || []).slice().sort(function (a, b) { return b[0] - a[0]; });
    var hit = rules.find(function (r) { return total >= r[0]; });
    card.querySelector("[data-total]").textContent = total;
    card.querySelector("[data-interp]").textContent = hit ? hit[1] : "";
  }
  function dtCard() {
    var d = KB.vaccines.dT;
    return '<section class="card" data-dt><h2 class="h2">กำหนดการวัคซีน dT</h2><p class="hint">' + esc(d.src) + '</p><fieldset class="mt-3 space-y-2"><legend class="lbl">' + esc(d.question) + "</legend>" +
      d.rules.map(function (r) { return '<label class="chk"><input type="radio" name="dt" value="' + r.id + '" data-act="dt" class="mt-1 h-5 w-5 shrink-0 accent-orange-500"><span class="text-gray-800">' + esc(r.history) + "</span></label>"; }).join("") +
      '</fieldset><div class="mt-4 rounded-xl bg-orange-50 p-3 text-gray-800" id="dtOut">เลือกประวัติวัคซีนเพื่อดูกำหนดการ</div><p class="hint mt-3">' + esc(d.note) + '</p><p class="mt-3 text-sm text-gray-700"><b>aP:</b> ' + esc(KB.vaccines.aP.text) + "</p></section>";
  }
  function updateDT() {
    var sel = document.querySelector('input[name="dt"]:checked'); if (!sel) return;
    var r = KB.vaccines.dT.rules.find(function (x) { return x.id === sel.value; });
    document.getElementById("dtOut").innerHTML = "<b>" + esc(r.give) + "</b>" + (r.then ? '<span class="block text-sm text-gray-600">จากนั้น ' + esc(r.then) + "</span>" : "");
  }
  function toolsView() {
    return '<div class="grid gap-5 lg:grid-cols-2">' + dtCard() + KB.tools.filter(function (t) { return t.type === "score"; }).map(scoreCard).join("") + "</div>";
  }

  /* ---------- KB viewer ---------- */
  function kbItem(o, level, sub) {
    var txt = (o.id + " " + (o.label || o.name) + " " + (sub || "")).toLowerCase();
    return '<div class="rounded-xl border border-orange-100 bg-white/70 p-3" data-kbitem data-level="' + (level || "") + '" data-flag="' + (o.review ? 1 : 0) + '" data-dec="' + (o.decision ? 1 : 0) + '" data-text="' + esc(txt) + '">' +
      '<div class="flex flex-wrap items-center gap-2">' + (level ? pill(level) : "") + '<span class="text-xs font-semibold text-gray-400">' + esc(o.id) + "</span>" + decisionBadge(o.decision) +
      (o.review ? '<span class="rounded bg-amber-100 px-1.5 text-[11px] font-semibold text-amber-800">' + esc(o.review.flag) + "</span>" : "") + "</div>" +
      '<div class="mt-1 text-gray-800">' + esc(o.label || o.name) + "</div>" + (sub ? '<div class="text-sm text-gray-600">' + esc(sub) + "</div>" : "") +
      '<div class="text-xs text-gray-400">' + esc(o.src || "") + "</div>" + (o.review ? '<p class="mt-1 text-xs text-amber-700">' + esc(o.review.note) + "</p>" : "") + evidenceDetails(o.decision) + "</div>";
  }
  function catString(cat) { return KB.mec.methods.map(function (m) { return E.METHOD_SHORT[m.id] + " " + cat[m.id]; }).join(" · "); }
  function kbView() {
    var m = KB.meta, nCrit = KB.conditions.reduce(function (n, c) { return n + c.criteria.length; }, 0);
    var counts = [["โรค", KB.conditions.length], ["เกณฑ์", nCrit], ["แถว MEC", KB.mec.rows.length], ["แจ้งเตือนยา", KB.drug_alerts.length], ["เครื่องมือ", KB.tools.length]];
    var ds = m.decisions_source || {};
    var meta = '<section class="card"><div class="flex flex-wrap items-center gap-3"><h2 class="h2">Knowledge base</h2>' + pill(m.status === "APPROVED" ? "GREEN" : "YELLOW").replace(/GREEN|YELLOW/, esc(m.status)) + "</div>" +
      '<dl class="mt-3 grid gap-x-6 gap-y-2 text-sm sm:grid-cols-2"><div><dt class="text-gray-500">เวอร์ชัน</dt><dd class="font-semibold text-gray-800">' + esc(m.version) + "</dd></div>" +
      '<div><dt class="text-gray-500">ผู้รับรองทางคลินิก</dt><dd class="font-semibold text-gray-800">' + esc(m.reviewed_by || "ยังไม่ระบุ") + "</dd></div>" +
      '<div><dt class="text-gray-500">บันทึกคำตัดสิน</dt><dd class="text-gray-800">' + esc((ds.document || "-") + " · " + (ds.date || "-")) + "</dd></div>" +
      '<div><dt class="text-gray-500">MEC อ้างอิง</dt><dd class="text-gray-800">' + esc(m.mec_reference ? m.mec_reference.policy + " (" + m.mec_reference.status + ")" : "-") + "</dd></div>" +
      '<div class="sm:col-span-2"><dt class="text-gray-500">แหล่งเนื้อหา</dt><dd class="text-gray-800">' + esc(m.source.title_th) + "</dd></div>" +
      '<div class="sm:col-span-2"><dt class="text-gray-500">SHA-256 ของ kb.json</dt><dd class="break-all font-mono text-xs text-gray-700">' + esc(SHA) + "</dd></div></dl>" +
      '<div class="mt-4 grid grid-cols-2 gap-3 sm:grid-cols-5">' + counts.map(function (c) { return '<div class="rounded-xl bg-white/80 p-3 ring-1 ring-orange-100"><div class="text-2xl font-bold text-gray-800">' + c[1] + '</div><div class="text-xs text-gray-500">' + c[0] + "</div></div>"; }).join("") + "</div></section>";
    var pend = (m.pending || []).length ? '<section class="card"><h2 class="h2">งานค้าง</h2><ul class="mt-2 space-y-2 text-sm">' + m.pending.map(function (p) {
      return '<li class="flex gap-2"><span class="shrink-0 rounded px-1.5 text-xs font-semibold ' + (p.blocking ? "bg-rose-100 text-rose-700" : "bg-slate-100 text-slate-600") + '">' + (p.blocking ? "ต้องทำก่อน APPROVED" : "ไม่ block") + '</span><span class="text-gray-800">' + esc(p.id + " · " + p.cd + " — " + p.task) + "</span></li>";
    }).join("") + "</ul></section>" : "";
    var filters = '<div class="no-print flex flex-wrap items-center gap-3"><input id="kbSearch" type="search" class="inp w-full sm:w-72" placeholder="ค้นหา id หรือข้อความ" data-input="kbSearch" aria-label="ค้นหาใน KB">' +
      '<select id="kbLevel" class="inp" data-act="kbfilter" aria-label="กรองระดับ"><option value="">ทุกระดับ</option><option>RED</option><option>YELLOW</option><option>INFO</option></select>' +
      '<label class="flex items-center gap-2 text-sm"><input id="kbFlag" type="checkbox" data-act="kbfilter" class="h-5 w-5 accent-orange-500">เฉพาะที่รอทบทวน</label>' +
      '<label class="flex items-center gap-2 text-sm"><input id="kbDec" type="checkbox" data-act="kbfilter" class="h-5 w-5 accent-orange-500">เฉพาะที่มีคำตัดสิน</label><span id="kbCount" class="text-sm text-gray-500"></span></div>';
    var crit = KB.conditions.map(function (c) {
      return '<h3 class="h3 mt-5">' + esc(c.label) + '</h3><div class="mt-2 grid gap-2 md:grid-cols-2">' + c.criteria.map(function (cr) { return kbItem(cr, cr.level, cr.action || cr.counsel || ""); }).join("") + "</div>";
    }).join("");
    var mods = '<h3 class="h3 mt-5">ข้อมูลทั่วไป</h3><div class="mt-2 grid gap-2 md:grid-cols-2">' + KB.general_modifiers.map(function (g) { return kbItem(g, g.level, g.counsel || ""); }).join("") + "</div>";
    var rows = '<h3 class="h3 mt-5">แถว MEC</h3><div class="mt-2 grid gap-2 md:grid-cols-2">' + KB.mec.rows.map(function (r) { return kbItem(r, "", catString(r.cat) + (r.note ? " · " + r.note : "")); }).join("") + "</div>";
    var drugs = '<h3 class="h3 mt-5">แจ้งเตือนยา</h3><div class="mt-2 grid gap-2 md:grid-cols-2">' + KB.drug_alerts.map(function (d) { return kbItem(d, d.level, d.alert + (d.action ? " → " + d.action : "")); }).join("") + "</div>";
    var oos = '<section class="card"><h2 class="h2">นอกขอบเขต</h2><ul class="mt-2 list-disc space-y-1 pl-5 text-sm text-gray-700">' + m.out_of_scope.map(function (o) { return "<li>บท " + esc(o.chapter) + " " + esc(o.topic) + " — " + esc(o.reason) + "</li>"; }).join("") + "</ul></section>";
    return '<div class="space-y-5">' + meta + pend + '<section class="card"><h2 class="h2">Rule ทั้งหมด</h2><div class="mt-3">' + filters + "</div>" + crit + mods + rows + drugs + "</section>" + oos + "</div>";
  }
  function applyKbFilter() {
    var q = ((document.getElementById("kbSearch") || {}).value || "").trim().toLowerCase();
    var lv = (document.getElementById("kbLevel") || {}).value || "";
    var fl = (document.getElementById("kbFlag") || {}).checked, dc = (document.getElementById("kbDec") || {}).checked, n = 0;
    document.querySelectorAll("[data-kbitem]").forEach(function (el) {
      var ok = (!q || el.dataset.text.indexOf(q) >= 0) && (!lv || el.dataset.level === lv) && (!fl || el.dataset.flag === "1") && (!dc || el.dataset.dec === "1");
      el.hidden = !ok; if (ok) n++;
    });
    var c = document.getElementById("kbCount"); if (c) c.textContent = "แสดง " + n + " รายการ";
  }

  /* ---------- error view (BR-15) ---------- */
  function errorView() {
    return '<section class="card border-rose-300"><h2 class="h2 text-rose-700">KB ไม่ผ่านการตรวจสอบ — ระบบปิดการประเมิน</h2><ul class="mt-3 list-disc space-y-1 pl-5 text-sm text-gray-700">' +
      KB_ERRORS.map(function (e) { return "<li>" + esc(e) + "</li>"; }).join("") + "</ul><p class=\"hint mt-3\">แก้ kb.json แล้วรัน node tools/build.js ใหม่</p></section>";
  }

  /* ---------- render & events ---------- */
  function currentRoute() { var r = (location.hash.replace(/^#\/?/, "") || "assess").split("/")[0]; return ["assess", "ref", "tools", "kb"].indexOf(r) >= 0 ? r : "assess"; }
  function render() {
    var route = currentRoute();
    document.querySelectorAll("[data-route]").forEach(function (a) { var on = a.dataset.route === route; a.classList.toggle("tab-on", on); if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    if (KB_ERRORS.length) { app.innerHTML = errorView(); return; }
    app.innerHTML = route === "ref" ? refView() : route === "tools" ? toolsView() : route === "kb" ? kbView() : assessView();
    if (route === "tools") document.querySelectorAll("[data-tool]").forEach(updateScore);
    if (route === "kb") applyKbFilter();
  }
  function top() { window.scrollTo(0, 0); }

  function copyNote() {
    var box = document.getElementById("noteBox"), msg = document.getElementById("copyMsg");
    if (!box) return;
    function done(ok) { if (msg) msg.textContent = ok ? "คัดลอกแล้ว — วางใน HOSxP ได้เลย" : "เลือกข้อความให้แล้ว กด Ctrl+C เพื่อคัดลอก"; }
    function fallback() { box.focus(); box.select(); var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; } done(ok); }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(box.value).then(function () { done(true); }, fallback);
    else fallback();
  }

  document.addEventListener("click", function (e) {
    var j = e.target.closest("a[data-jump]");
    if (j) { e.preventDefault(); var t = document.getElementById(j.dataset.jump); if (t) t.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    var b = e.target.closest("button[data-act]");
    if (!b || b.disabled || !app.contains(b)) return;
    var a = b.dataset.act, v = b.dataset.v;
    switch (a) {
      case "preg": S.pregnant = v === "1"; if (S.pregnant) { S.intention = null; S.everSex = null; } else S.ga = null; break;
      case "intent": S.intention = v; if (v !== "NO") S.everSex = null; break;
      case "sex": S.everSex = v === "1"; break;
      case "cond":
        toggle(S.conditions, v);
        var on = S.conditions.indexOf(v) >= 0;
        if (!on) { var c = KB.conditions.find(function (x) { return x.id === v; }); (c ? c.criteria : []).forEach(function (cr) { delete S.criteria[cr.id]; }); }
        b.classList.toggle("opt-on", on); b.setAttribute("aria-pressed", on); return;
      case "tri":
        S.criteria[b.dataset.id] = v === "true" ? true : v === "unknown" ? "unknown" : false;
        b.parentElement.querySelectorAll("button").forEach(function (x) { var o = x === b; x.classList.toggle("seg-on", o); x.setAttribute("aria-pressed", o); });
        return;
      case "next": if (S.step === 1 && !step1Valid()) return; S.step = Math.min(4, S.step + 1); S.maxStep = Math.max(S.maxStep, S.step); render(); top(); return;
      case "back": S.step = Math.max(1, S.step - 1); render(); top(); return;
      case "goto": var n = Number(v); if (n <= S.maxStep) { S.step = n; render(); top(); } return;
      case "edit": S.step = 2; render(); top(); return;
      case "reset": if (!window.confirm("เริ่มประเมินรายใหม่? ข้อมูลของรายนี้จะถูกล้าง")) return; S = newState(); render(); top(); return;
      case "copy": copyNote(); return;
      case "print": window.print(); return;
      default: return;
    }
    render();
  });

  app.addEventListener("change", function (e) {
    var t = e.target, a = t.dataset && t.dataset.act; if (!a) return;
    if (a === "mod") toggle(S.modifiers, t.dataset.v);
    else if (a === "crit") S.criteria[t.dataset.v] = t.checked;
    else if (a === "drug") toggle(S.drugs, t.dataset.v);
    else if (a === "score") { updateScore(t.closest("[data-tool]")); return; }
    else if (a === "dt") { updateDT(); return; }
    else if (a === "kbfilter") { applyKbFilter(); return; }
    else return;
    var lab = t.closest("label"); if (lab) lab.classList.toggle("chk-on", t.checked);
  });

  app.addEventListener("input", function (e) {
    var t = e.target, k = t.dataset && t.dataset.input; if (!k) return;
    var q = (t.value || "").trim().toLowerCase();
    if (k === "ga") { var n = parseInt(t.value, 10); S.ga = isFinite(n) ? n : null; var nb = document.getElementById("nextBtn"); if (nb) nb.disabled = !step1Valid(); }
    else if (k === "drugFilter") document.querySelectorAll("#drugList [data-drug]").forEach(function (el) { el.hidden = !!q && el.dataset.drug.indexOf(q) < 0; });
    else if (k === "mecFilter") document.querySelectorAll("[data-mecrow]").forEach(function (el) { el.hidden = !!q && el.dataset.mecrow.indexOf(q) < 0; });
    else if (k === "kbSearch") applyKbFilter();
  });

  if (KB && KB.meta.status !== "APPROVED") {
    document.getElementById("kbBanner").innerHTML = '<div class="bg-amber-100 text-sm text-amber-900"><div class="mx-auto max-w-6xl px-4 py-2">KB v' + esc(KB.meta.version) + " · สถานะ " + esc(KB.meta.status) +
      " — ยังไม่ผ่านการรับรองทางคลินิก ห้ามใช้ตัดสินใจกับผู้ป่วยจริง</div></div>";
  }
  window.addEventListener("hashchange", function () { render(); top(); });
  render();
})();
</script>
</body>
</html>
